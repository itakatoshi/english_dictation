<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Dictation Trainer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <h1>Dictation Trainer</h1>

    <label class="switch-row">
      <span>Dictation</span>
      <input id="enabled" type="checkbox" />
    </label>

    <label>
      モード
      <select id="mode">
        <option value="full">全文</option>
        <option value="blanks">穴埋め</option>
        <option value="keyword">キーワード1語</option>
      </select>
    </label>

    <label>
      難易度
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="normal">Normal</option>
        <option value="hard">Hard</option>
      </select>
    </label>

    <label id="blankCountRow">
      穴の数
      <select id="blankCount">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>

    <label>
      再生速度
      <select id="playbackRate">
        <option value="0.75">0.75x</option>
        <option value="1">1.0x</option>
        <option value="1.2">1.2x</option>
        <option value="1.5">1.5x</option>
      </select>
    </label>

    <label class="switch-row small">
      <span>正解後に自動で次へ</span>
      <input id="autoResume" type="checkbox" />
    </label>

    <p class="hint">YouTubeで英語字幕をONにして使います。全文モードでは単語数・文字数のガイドだけが表示されます。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
