<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Dictation Trainer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <h1>Dictation Trainer</h1>

    <label class="switch-row">
      <span>Dictation</span>
      <input id="enabled" type="checkbox" />
    </label>

    <label>
      モード
      <select id="mode">
        <option value="full">全文</option>
        <option value="blanks">穴埋め</option>
        <option value="keyword">キーワード1語</option>
      </select>
    </label>

    <label>
      難易度
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="normal">Normal</option>
        <option value="hard">Hard</option>
      </select>
    </label>

    <label id="blankCountRow">
      穴の数
      <select id="blankCount">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
      </select>
    </label>

    <label>
      1問の長さ
      <select id="unitLength">
        <option value="short">短め（1行ずつ）</option>
        <option value="normal">標準（1文 / 8秒）</option>
        <option value="long">長め（14秒まで）</option>
      </select>
    </label>

    <label>
      聞き直し速度
      <select id="playbackRate">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1">1.0x</option>
        <option value="1.2">1.2x</option>
        <option value="1.5">1.5x</option>
      </select>
    </label>

    <label class="switch-row small">
      <span>正解後に自動で次へ</span>
      <input id="autoResume" type="checkbox" />
    </label>

    <p class="hint">英語字幕トラックのある動画で使えます（YouTube側で字幕をONにする必要はありません）。</p>

    <section class="review">
      <div class="review-head">
        <h2>復習リスト</h2>
        <span id="totals" class="totals"></span>
      </div>
      <ol id="mistakes" class="mistakes"></ol>
      <p id="empty" class="empty">間違えた文がここに溜まります。</p>
      <button id="clear" type="button" class="clear" hidden>履歴を消去</button>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
